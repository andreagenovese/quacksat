# quacksat configuration — install as /etc/robot/quacksat.toml

# Voice backend:
#   "none"    → bring-up mode: capture + VAD + wake, chirp on wake, no conversation
#   "wyoming" → Home Assistant Assist satellite (Wyoming protocol)
#   "agent"   → WebSocket bridge to an STT → LLM → TTS agent
#   "direct"  → self-contained: the satellite calls OpenAI-dialect
#               STT/LLM/TTS endpoints itself, no bridge, no server
backend = "none"

# Path to the robotd JSON-RPC unix socket.
# For remote development against a forwarded socket, use /tmp/robotd.sock.
robotd_socket = "/run/robotd.sock"

[audio]
# ALSA devices (ADR 0003). Capture needs audio.pet_detect = false in
# /etc/robot/robotd.toml — the factory default.
playback_device = "plughw:aic3104"
capture_device = "plughw:aic3104,0"
# Development hook: replace arecord with any command writing raw S16_LE
# 2ch 48kHz to stdout. macOS with the real mic (brew install sox):
# capture_command = ["sox", "-q", "-d", "-t", "raw", "-r", "48000", "-c", "2", "-e", "signed-integer", "-b", "16", "-"]
# Development hook: playback program spawned with aplay-style arguments.
# macOS speakers via sox: playback_program = "scripts/aplay-shim-macos.sh"
# Wake acknowledgement: on the robot the duck chirps via robotd; when it
# cannot (dev machine, empty sound bank) the satellite plays this wav,
# or a built-in synthesized quack if unset.
# wake_sound = "/path/to/quack.wav"

[wake]
# "openwakeword" (real wake word), "energy" (bring-up: every utterance
# wakes), or "disabled".
mode = "openwakeword"
# openWakeWord models — populate with scripts/fetch-wake-models.sh <dir>.
# On the robot: /var/lib/quacksat/models. For dev: "models".
models_dir = "/var/lib/quacksat/models"
# Wake model file inside models_dir. "hey Daffy" is quacksat's own wake
# word and ships in the repo (models/hey_daffy.onnx); pretrained
# alternatives (hey_jarvis, ...) or your own phrase trained per
# docs/custom-wake-word.md drop in here.
model = "hey_daffy.onnx"
# Detection threshold on the 0..1 score.
threshold = 0.5

[agent]
# The bridge WebSocket URL (agent backend, ADR 0004) and optional
# bearer token for the upgrade request.
url = "ws://127.0.0.1:8765"
# token = "..."

[wyoming]
# Where the satellite listens; point Home Assistant's Wyoming integration
# at this host and port (Settings → Devices & Services → Add integration
# → Wyoming Protocol).
bind = "0.0.0.0:10700"
# Name shown in Home Assistant; optional area hint.
name = "quacksat"
# area = "Living room"

[direct.llm]
# Any /chat/completions endpoint (OpenAI, a local ollama, ...).
base_url = "http://localhost:11434/v1"
api_key = ""
model = "qwen3:8b"
tool_calling = true

[direct.stt]
# Any /audio/transcriptions endpoint.
base_url = "http://localhost:9000/v1"
api_key = ""
language = "it"

[direct.tts]
# Any /audio/speech endpoint returning WAV.
base_url = "http://localhost:9100/v1"
api_key = ""
voice = "it_IT-paola-medium"

# The duck's own MCP server (direct backend): the robot tool catalog
# served over Streamable HTTP so MCP-capable agents (Arkimede, Claude
# Desktop, ...) can drive the body directly. The token is MANDATORY.
# [direct.mcp]
# enabled = true
# port = 8767
# token = "change-me"
